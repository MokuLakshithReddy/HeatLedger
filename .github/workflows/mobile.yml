name: Mobile CI

on:
  push:
    branches: [ main, fix/production-readiness ]
  pull_request:
    branches: [ main ]

jobs:
  mobile-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        working-directory: ./mobile
        run: npm ci

      - name: Expo SDK & Native Dependencies Verification
        working-directory: ./mobile
        run: |
          npx expo install --check
          npx expo-doctor

      - name: TypeScript Typecheck
        working-directory: ./mobile
        run: npx tsc --noEmit
