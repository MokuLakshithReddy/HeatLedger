name: Backend CI

on:
  push:
    branches: [ main, fix/production-readiness ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: heatledger_user
          POSTGRES_PASSWORD: heatledger_pass
          POSTGRES_DB: test_heatledger_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libpq-dev postgresql-client

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install psycopg2-binary bandit

      - name: Test Alembic Migrations against Clean PostgreSQL
        env:
          DATABASE_URL: postgresql://heatledger_user:heatledger_pass@localhost:5432/test_heatledger_db
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run PostgreSQL Row Level Security (RLS) Tests
        env:
          ENVIRONMENT: test
          APP_SECRET_KEY: test-secret-key-32-chars-long-minimum-here
          DATABASE_URL: postgresql://heatledger_user:heatledger_pass@localhost:5432/test_heatledger_db
          POSTGRES_TEST_DATABASE_URL: postgresql://heatledger_user:heatledger_pass@localhost:5432/test_heatledger_db
          STORAGE_BACKEND: local
        run: |
          python -m pytest backend/tests/integration/test_postgresql_rls.py -v

      - name: Run Full Backend Test Suite
        env:
          ENVIRONMENT: test
          APP_SECRET_KEY: test-secret-key-32-chars-long-minimum-here
          DATABASE_URL: sqlite:///./test_heatledger.db
          DEMO_MODE: "true"
          STORAGE_BACKEND: local
        run: |
          python -m pytest backend/tests -v
