name: Security Audit & SAST

on:
  push:
    branches: [ main, fix/production-readiness ]
  pull_request:
    branches: [ main ]

jobs:
  sast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Bandit SAST Scanner
        run: pip install bandit

      - name: Run Bandit Security Analysis
        run: |
          bandit -r backend/app -x backend/tests -ll -ii
